faq:
- question: How much does an implant cost?
  answer: Single implants start at 900 EUR including the crown. You get a written
    quote after the scan, and it does not change once work begins.
- question: Does it hurt?
  answer: Placement is done under local anaesthetic and most people describe it as
    pressure rather than pain. We talk through sedation options beforehand.
- question: How long does treatment take?
  answer: A single implant is usually two visits about three months apart, to let
    the bone heal around the post before the crown goes on.
- question: Is there parking nearby?
  answer: There is paid street parking on Tsimiski and a public car park two minutes
    walk away.

