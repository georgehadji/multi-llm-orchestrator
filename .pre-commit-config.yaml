# ─────────────────────────────────────────────────────────────────────────────
# Pre-commit hooks — Multi-LLM Orchestrator
# Every hook must pass before "git commit" proceeds.
# ─────────────────────────────────────────────────────────────────────────────
repos:
  - repo: local
    hooks:
      - id: black
        name: black (formatting check)
        entry: black --check --line-length=100 orchestrator/ tests/
        language: system
        types: [python]
        pass_filenames: false

      - id: ruff
        name: ruff (linter)
        entry: ruff check orchestrator/ tests/
        language: system
        types: [python]
        pass_filenames: false

      - id: import-linter
        name: import-linter (architectural contracts)
        # Invoked through `python -X utf8` rather than the `lint-imports`
        # console script: on Windows the default cp1252 locale makes grimp's
        # source reads die with "'charmap' codec can't decode byte 0x90",
        # failing the hook on a clean tree. pre-commit has no per-hook env, so
        # the encoding is forced on the interpreter.
        entry: python -X utf8 -c "from importlinter.cli import lint_imports_command as c; c()"
        language: system
        types: [python]
        pass_filenames: false
        description: |
          Enforces 5 architectural contracts:
            - domain → no infra/application/engine imports
            - application → no concrete infra imports
            - application → no engine imports
            - engine_core pipeline → no direct infra imports
            - root modules → no infra imports (shims excepted)
