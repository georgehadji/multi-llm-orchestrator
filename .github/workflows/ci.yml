name: CI

on:
  push:
    branches: [master, main, "claude/**", "docs/**"]
  pull_request:
    branches: [master, main]

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install lint dependencies
        # Pin black so CI and local pre-commit format identically (a floating
        # black version reformats files that pass locally and breaks the gate).
        run: pip install "black==26.1.0" ruff
      - name: Check formatting
        run: black --check orchestrator/ tests/
      - name: Run ruff
        run: ruff check orchestrator/ tests/

  architecture:
    name: Architecture Boundaries
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install dependencies
        run: pip install -e ".[dev]" || pip install -e "." import-linter
      - name: Check import boundaries
        run: lint-imports
        # Enforces 5 contracts: domain-purity, application-no-concrete-infra,
        # application-services-no-engine, engine-core-no-loose-infra,
        # root-modules-no-infra.
        # This job MUST pass — architecture violations block merge.
      - name: Fetch baseline branch
        run: git fetch --no-tags origin master:refs/remotes/origin/master
      - name: Check root module freeze
        run: python scripts/check_root_module_freeze.py
        # Ensures no new root-level orchestrator/*.py files are added without
        # explicit architectural review.  Baseline embedded in the script.
        # Part of Architecture Remediation Plan V2 — Phase 3.1e.
      - name: Check test marker coverage
        run: python scripts/check_test_markers.py
  typecheck:
    name: Type Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install dependencies
        run: pip install -e ".[dev]" || pip install -e "." mypy
      - name: Run mypy (core layers)
        # Check domain and application layers strictly — these must stay clean.
        # Infrastructure and engine layers still have known issues; warn only.
        #
        # --follow-imports=silent is what makes "warn only" true. Without it
        # mypy REPORTS errors from every module it reaches transitively, so this
        # job emitted 1432 errors across 182 files and the core-layer signal was
        # invisible (it had been red since 2026-07-11). "silent" still fully
        # ANALYSES imported modules — it only suppresses reporting errors found
        # in files outside the ones named here. Type checking of the core layers
        # is therefore unchanged in strictness; two real runtime bugs were found
        # by exactly this invocation. Do not weaken it to "skip", which would
        # degrade imports to Any and genuinely reduce coverage.
        run: |
          mypy orchestrator/domain/ orchestrator/application/ \
               orchestrator/engine_core/container.py \
               --ignore-missing-imports --no-strict-optional --python-version=3.12 \
               --follow-imports=silent
      - name: Run mypy (full codebase — informational)
        run: mypy orchestrator/ --ignore-missing-imports --no-strict-optional
        continue-on-error: true

  test:
    name: Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install dependencies
        run: pip install -e ".[dev]" || pip install -e "." pytest pytest-asyncio pytest-cov structlog
      - name: Run unit + integration tests
        run: |
          pytest -m "not slow and not requires_api and not stress and not e2e" \
            --tb=short -q \
            --ignore=tests/test_service_observability.py \
            --cov=orchestrator \
            --cov-report=xml \
            --cov-report=term-missing \
            --cov-fail-under=6
        # Coverage floor: 6%. Ratchet this upward as coverage grows.
        # Never lower this number — only raise it.
      - name: Run contract tests
        run: |
          pytest tests/contracts/ -v --tb=short --no-cov
        env:
          OPENAI_API_KEY: ""
          ANTHROPIC_API_KEY: ""
          GOOGLE_API_KEY: ""
          OPENROUTER_API_KEY: ""
      - name: Upload coverage
        uses: codecov/codecov-action@v4
        if: always()
        with:
          file: ./coverage.xml
          fail_ci_if_error: false

  model-audit:
    name: OpenRouter Model Audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Audit referenced model ids against live OpenRouter catalogue
        # Keyless GET of https://openrouter.ai/api/v1/models; exits non-zero if
        # any referenced id is dead or an UNAVAILABLE_MODELS replacement is dead.
        # Exit 2 (network failure) is tolerated so transient flakes don't block.
        run: |
          set +e
          python scripts/audit_openrouter_models.py
          code=$?
          if [ "$code" = "2" ]; then
            echo "::warning::OpenRouter catalogue unreachable — audit skipped"
            exit 0
          fi
          exit "$code"

  security:
    name: Security Scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install bandit
        run: pip install bandit[toml]
      - name: Run bandit (HIGH severity only)
        run: |
          bandit -r orchestrator/ \
            --severity-level high \
            --confidence-level medium \
            -x orchestrator/graphify-out \
            -f txt
        # continue-on-error removed — all HIGH findings fixed or justified (#nosec)
